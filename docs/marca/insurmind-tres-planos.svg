<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" width="1000" height="700" aria-label="Diagrama de tres planos. Arriba, el asegurado entra por dos canales: una landing personalizada y WhatsApp. En el centro, la plataforma Insurmind con cuatro módulos: captación, conversación, cobranza y control. Abajo, varias aseguradoras, con su tarificación, emisión y pagos, a las que Insurmind consulta y de las que recibe precios, pólizas y recibos.">
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#101917"/>
          </marker>
          <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#0A6B58"/>
          </marker>
        </defs>

        <!-- PLANO 1 -->
        <text x="40" y="34" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.6" fill="#5B6E68">EL ASEGURADO · CANALES</text>

        <rect x="240" y="52" width="280" height="62" rx="8" fill="none" stroke="#101917" stroke-width="1.4"/>
        <text x="380" y="82" text-anchor="middle" font-size="15" fill="#101917">Landing personalizada</text>
        <text x="380" y="100" text-anchor="middle" font-size="11.5" fill="#5B6E68">por marca, por broker, por campaña</text>

        <rect x="560" y="52" width="200" height="62" rx="8" fill="none" stroke="#101917" stroke-width="1.4"/>
        <text x="660" y="82" text-anchor="middle" font-size="15" fill="#101917">WhatsApp</text>
        <text x="660" y="100" text-anchor="middle" font-size="11.5" fill="#5B6E68">hasta la emisión</text>

        <line x1="380" y1="114" x2="380" y2="204" stroke="#101917" stroke-width="1.3" marker-end="url(#ah)"/>
        <text x="392" y="164" font-size="12" fill="#5B6E68">cotiza</text>
        <line x1="660" y1="114" x2="660" y2="204" stroke="#101917" stroke-width="1.3" marker-end="url(#ah)"/>
        <text x="672" y="164" font-size="12" fill="#5B6E68">conversa</text>

        <!-- PLANO 2 -->
        <rect x="60" y="208" width="880" height="222" rx="12" fill="#E3F0EB" stroke="#0A6B58" stroke-width="1.8"/>
        <text x="84" y="248" font-size="23" font-weight="700" fill="#0A6B58" letter-spacing="-0.3">insurmind</text>
        <text x="84" y="272" font-size="13" fill="#5B6E68">Cotiza, resuelve, emite y cobra. Sin intervención.</text>

        <rect x="78" y="292" width="196" height="102" rx="8" fill="#FFFFFF" stroke="#CFDBD6" stroke-width="1.2"/>
        <text x="176" y="320" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12.5" letter-spacing="1.2" fill="#101917">CAPTACIÓN</text>
        <text x="176" y="345" text-anchor="middle" font-size="11.5" fill="#5B6E68">Landings propias</text>
        <text x="176" y="362" text-anchor="middle" font-size="11.5" fill="#5B6E68">y posicionadas</text>

        <rect x="294" y="292" width="196" height="102" rx="8" fill="#FFFFFF" stroke="#CFDBD6" stroke-width="1.2"/>
        <text x="392" y="320" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12.5" letter-spacing="1.2" fill="#101917">CONVERSACIÓN</text>
        <text x="392" y="345" text-anchor="middle" font-size="11.5" fill="#5B6E68">Dudas, recotización,</text>
        <text x="392" y="362" text-anchor="middle" font-size="11.5" fill="#5B6E68">descuentos, emisión</text>

        <rect x="510" y="292" width="196" height="102" rx="8" fill="#FFFFFF" stroke="#CFDBD6" stroke-width="1.2"/>
        <text x="608" y="320" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12.5" letter-spacing="1.2" fill="#101917">COBRANZA</text>
        <text x="608" y="345" text-anchor="middle" font-size="11.5" fill="#5B6E68">Recibo por vencer</text>
        <text x="608" y="362" text-anchor="middle" font-size="11.5" fill="#5B6E68">y liga de pago</text>

        <rect x="726" y="292" width="196" height="102" rx="8" fill="#FFFFFF" stroke="#CFDBD6" stroke-width="1.2"/>
        <text x="824" y="320" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12.5" letter-spacing="1.2" fill="#101917">CONTROL</text>
        <text x="824" y="345" text-anchor="middle" font-size="11.5" fill="#5B6E68">Conversión y embudo</text>
        <text x="824" y="365" text-anchor="middle" font-size="11.5" fill="#0A6B58">↑ una persona puede entrar</text>

        <!-- PLANO 2 -> 3 -->
        <line x1="420" y1="430" x2="420" y2="524" stroke="#0A6B58" stroke-width="1.6" marker-end="url(#ahA)"/>
        <text x="408" y="482" text-anchor="end" font-size="12" fill="#5B6E68">consulta y ejecuta</text>
        <line x1="580" y1="524" x2="580" y2="430" stroke="#101917" stroke-width="1.3" marker-end="url(#ah)"/>
        <text x="592" y="482" font-size="12" fill="#5B6E68">precios, pólizas y recibos</text>

        <!-- PLANO 3 -->
        <text x="40" y="512" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.6" fill="#5B6E68">LAS ASEGURADORAS · UNA O VARIAS A LA VEZ</text>

        <rect x="109" y="528" width="210" height="112" rx="8" fill="none" stroke="#101917" stroke-width="1.4"/>
        <text x="214" y="556" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.2" fill="#101917">ASEGURADORA</text>
        <text x="214" y="581" text-anchor="middle" font-size="11.5" fill="#5B6E68">tarificación</text>
        <text x="214" y="600" text-anchor="middle" font-size="11.5" fill="#5B6E68">emisión</text>
        <text x="214" y="619" text-anchor="middle" font-size="11.5" fill="#5B6E68">pagos</text>

        <rect x="343" y="528" width="210" height="112" rx="8" fill="none" stroke="#101917" stroke-width="1.4"/>
        <text x="448" y="556" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.2" fill="#101917">ASEGURADORA</text>
        <text x="448" y="581" text-anchor="middle" font-size="11.5" fill="#5B6E68">tarificación</text>
        <text x="448" y="600" text-anchor="middle" font-size="11.5" fill="#5B6E68">emisión</text>
        <text x="448" y="619" text-anchor="middle" font-size="11.5" fill="#5B6E68">pagos</text>

        <rect x="577" y="528" width="210" height="112" rx="8" fill="none" stroke="#101917" stroke-width="1.4"/>
        <text x="682" y="556" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.2" fill="#101917">ASEGURADORA</text>
        <text x="682" y="581" text-anchor="middle" font-size="11.5" fill="#5B6E68">tarificación</text>
        <text x="682" y="600" text-anchor="middle" font-size="11.5" fill="#5B6E68">emisión</text>
        <text x="682" y="619" text-anchor="middle" font-size="11.5" fill="#5B6E68">pagos</text>

        <rect x="811" y="528" width="80" height="112" rx="8" fill="none" stroke="#0A6B58" stroke-width="1.4" stroke-dasharray="5 4"/>
        <text x="851" y="590" text-anchor="middle" font-size="20" fill="#0A6B58">+ N</text>

        <text x="40" y="672" font-size="12" fill="#5B6E68">El core —póliza de registro, siniestros, contabilidad técnica— vive en este plano. No es nuestro.</text>
      </svg>